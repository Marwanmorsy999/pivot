name: Regenerate Go module metadata

on:
  push:
    branches:
      - chore/dependency-cobra-1.10.2-clean

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[regen-go-sums]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: false
          cache: false

      - name: Regenerate module metadata
        run: go mod tidy

      - name: Commit generated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- go.mod go.sum; then
            echo 'Go module metadata already clean.'
            exit 0
          fi
          git add go.mod go.sum
          git commit -m 'chore(deps): regenerate Go module metadata [regen-go-sums]'
          git push origin HEAD:${{ github.ref_name }}
