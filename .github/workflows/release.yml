name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  build:
    name: Build ${{ matrix.GOOS }}/${{ matrix.GOARCH }}
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
            BINARY: pivot-linux-amd64
          - runner: macos-13
            GOOS: darwin
            GOARCH: amd64
            BINARY: pivot-darwin-amd64
          - runner: macos-latest
            GOOS: darwin
            GOARCH: arm64
            BINARY: pivot-darwin-arm64
          - runner: windows-latest
            GOOS: windows
            GOARCH: amd64
            BINARY: pivot-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          CGO_ENABLED: '1'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          go build -ldflags="-s -w -X main.version=${VERSION}" -o "${{ matrix.BINARY }}" ./cmd/pivot

      - name: Smoke test binary
        if: matrix.GOOS != 'windows'
        shell: bash
        run: ./"${{ matrix.BINARY }}" --help

      - name: Smoke test Windows binary
        if: matrix.GOOS == 'windows'
        shell: pwsh
        run: '& "./${{ matrix.BINARY }}" --help'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.BINARY }}
          path: ${{ matrix.BINARY }}
          retention-days: 1

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: syft ./cmd/pivot -o spdx-json=pivot.sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: pivot.sbom.spdx.json
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: pivot-*
          merge-multiple: true

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            pivot-linux-amd64
            pivot-darwin-amd64
            pivot-darwin-arm64
            pivot-windows-amd64.exe
          )
          for artifact in "${expected[@]}"; do
            test -f "$artifact"
            test -s "$artifact"
          done
          test -s pivot.sbom.spdx.json
          test "$(find . -maxdepth 1 -type f -name 'pivot-*' | wc -l)" -eq "${#expected[@]}"

      - name: Generate SHA256 checksums
        shell: bash
        run: sha256sum pivot-* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pivot-*
            *.spdx.json
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
