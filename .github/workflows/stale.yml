name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/stale@v9
        with:
          # Issue settings
          stale-issue-message: |
            This issue has been inactive for 30 days. 
            Please comment if you're still experiencing this problem or if there's any update.
            Otherwise, it will be closed in 7 days.
          close-issue-message: |
            This issue was automatically closed due to inactivity. 
            Feel free to reopen if the problem persists in the latest version.
          stale-issue-label: stale
          exempt-issue-labels: bug,security,help-wanted,pinned
          days-before-issue-stale: 30
          days-before-issue-close: 7
          
          # PR settings
          stale-pr-message: |
            This PR has been inactive for 14 days.
            Please update the branch or provide an update on the status.
            Otherwise, it will be closed in 7 days.
          close-pr-message: |
            This PR was automatically closed due to inactivity.
            Feel free to reopen when you're ready to continue working on it.
          stale-pr-label: stale
          exempt-pr-labels: pinned,security
          days-before-pr-stale: 14
          days-before-pr-close: 7
          
          # General settings
          operations-per-run: 50
          remove-stale-when-updated: true
          enable-statistics: true
