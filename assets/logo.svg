<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="100%" style="stop-color:#302b63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7D56F4"/>
      <stop offset="100%" style="stop-color:#04B575"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Compass/arrow shape -->
  <g filter="url(#glow)">
    <polygon points="64,8 72,64 64,120 56,64" fill="url(#accent)" opacity="0.9"/>
    <polygon points="8,64 64,72 120,64 64,56" fill="#7D56F4" opacity="0.4"/>
    <circle cx="64" cy="64" r="8" fill="#04B575"/>
    <circle cx="64" cy="64" r="4" fill="#fff"/>
  </g>
</svg>
