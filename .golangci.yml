run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gosec
    - goimports
    - misspell
    - bodyclose
    - unconvert
    - nakedret
    - prealloc

linters-settings:
  gosec:
    severity: medium
    confidence: medium
  goimports:
    local-prefixes: github.com/Marwanmorsy999/pivot
  misspell:
    locale: US
  nakedret:
    max-func-lines: 30

issues:
  exclude-rules:
    - path: _test\.go$
      linters:
        - errcheck
        - gosec
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    - format: colored-line-number
