version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - bodyclose
    - unconvert
    - nakedret
    - prealloc

  settings:
    gosec:
      severity: medium
      confidence: medium
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Marwanmorsy999/pivot

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
