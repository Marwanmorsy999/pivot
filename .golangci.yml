version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - bodyclose
    - unconvert
    - nakedret
    - prealloc

  settings:
    gosec:
      severity: medium
      confidence: medium
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go$
      linters:
        - errcheck
        - gosec
    - path: internal/config/config\.go$
      text: "G304:"
      linters:
        - gosec
    - path: internal/core/executor\.go$
      text: "G204:"
      linters:
        - gosec
    - path: internal/worktree/worktree\.go$
      text: "G204:"
      linters:
        - gosec

output:
  formats:
    - format: colored-line-number
      path: stdout

